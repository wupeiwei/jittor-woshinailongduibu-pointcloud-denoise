# PW-SENEL ablation config.
# PW-SENEL = PeiWei Softmax Edge-aware Noise Elimination and Locking.
# Core: Softmax noise suppression + MaxPool edge locking.

experiment:
  name: denoise_pwsenel
  seed: 123

paths:
  data_root: /home/sallen/jittor-pointcloud-denoise/dataset_train
  test_root: /home/sallen/jittor-pointcloud-denoise/dataset_test_noisy
  train_list: /home/sallen/jittor-pointcloud-denoise/starter_code/datalist/train.txt
  out_dir: /home/sallen/jittor-pointcloud-denoise/results/denoise_pwsenel
  zip: /home/sallen/jittor-pointcloud-denoise/result_denoise_pwsenel.zip
  ckpt: /home/sallen/jittor-pointcloud-denoise/experiments/denoise_pwsenel/pwsenel.pkl

train:
  steps: 5000
  limit: 2000
  num_points: 2048
  batch_size: 2
  lr: 0.0001
  noise_min: 0.005
  noise_max: 0.02
  # Keep loss schedule comparable with denoise_baseline.yaml for ablation.
  cd_weight: 0.1
  log_every: 20
  save_every: 500

model:
  k: 16
  feat_dim: 256
  hidden: 256
  pwsenel: true
  staas: false
  staas_strength: 1.0
  staas_tau0: 0.02
  staas_tau_min: 0.005
  staas_tau_max: 0.08

predict:
  limit: 0
  patch_size: 1000
