# ST-AAS v2 high-noise expert for noisy-only router.
# Not intended as a global replacement model: low/mid-noise should route to baseline.
# Train distribution deliberately matches the high-noise region where v2 warm-start
# beat baseline in paired synthetic evaluation.

experiment:
  name: denoise_staas_v2_highnoise_expert
  seed: 123

paths:
  data_root: dataset_train
  test_root: dataset_test_noisy
  train_list: starter_code/datalist/train.txt
  out_dir: results/denoise_staas_v2_highnoise_expert
  zip: result_denoise_staas_v2_highnoise_expert.zip
  ckpt: experiments/denoise_staas_v2_highnoise_expert/staas_v2_highnoise_expert.pkl
  warm_start: experiments/denoise_baseline/baseline.pkl

train:
  steps: 5000
  limit: 0
  num_points: 2048
  batch_size: 2
  lr: 0.00008
  noise_min: 0.020
  noise_max: 0.040
  cd_weight: 0.1
  identity_weight: 0.005
  movement_weight: 0.001
  log_every: 20
  save_every: 500

model:
  k: 24
  feat_dim: 256
  hidden: 256
  pwsenel: false
  staas: false
  staas_fusion: true
  staas_v2_gate: true
  staas_v2_geo_weight: 0.25
  staas_v2_gate_min: 0.35
  staas_v2_gate_max: 1.0
  staas_v2_noise_ref_low: 0.010
  staas_v2_noise_ref_high: 0.030
  staas_strength: 0.0
  staas_tau0: 0.02
  staas_tau_min: 0.004
  staas_tau_max: 0.10
  move_gate: false
  pwsenel_v2: false
  residual_clip: 0.0
  adaptive_clip: false

predict:
  limit: 0
  patch_size: 8192
