# ST-AAS v0 ablation config.
# ST-AAS = Structure Tensor-guided Adaptive Softmax.
# Core: density-adaptive softmax smoothing + structure-tensor edge-aware suppression.

experiment:
  name: denoise_staas_v0
  seed: 123

paths:
  data_root: dataset_train
  test_root: dataset_test_noisy
  train_list: starter_code/datalist/train.txt
  out_dir: results/denoise_staas_v0
  zip: result_denoise_staas_v0.zip
  ckpt: experiments/denoise_staas_v0/staas_v0.pkl

train:
  steps: 5000
  limit: 2000
  num_points: 2048
  batch_size: 2
  lr: 0.0001
  noise_min: 0.005
  noise_max: 0.02
  # Keep loss schedule comparable with denoise_baseline.yaml for ablation.
  cd_weight: 0.1
  log_every: 20
  save_every: 500

model:
  k: 16
  feat_dim: 256
  hidden: 256
  pwsenel: false
  staas: true
  staas_strength: 1.0
  staas_tau0: 0.02
  staas_tau_min: 0.005
  staas_tau_max: 0.08

predict:
  limit: 0
  patch_size: 1000
