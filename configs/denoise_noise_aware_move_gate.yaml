experiment:
  name: denoise_noise_aware_move_gate
  seed: 123

paths:
  data_root: dataset_train
  test_root: dataset_test_noisy
  train_list: starter_code/datalist/train.txt
  out_dir: results/denoise_noise_aware_move_gate
  zip: result_denoise_noise_aware_move_gate.zip
  ckpt: experiments/denoise_noise_aware_move_gate/noise_aware_move_gate.pkl

train:
  steps: 5000
  limit: 0
  num_points: 2048
  batch_size: 2
  lr: 0.0001
  noise_min: 0.005
  noise_max: 0.02
  cd_weight: 0.1
  log_every: 20
  save_every: 500

model:
  k: 16
  feat_dim: 256
  hidden: 256
  pwsenel: false
  staas: false
  move_gate: true
  noise_aware_move_gate: true
  noise_aware_gate_min: 0.45
  noise_aware_gate_ref_low: 0.022
  noise_aware_gate_ref_high: 0.036
  pwsenel_v2: false
  residual_clip: 0.0
  adaptive_clip: false
  staas_strength: 1.0
  staas_tau0: 0.02
  staas_tau_min: 0.005
  staas_tau_max: 0.08

predict:
  limit: 0
  patch_size: 1000
