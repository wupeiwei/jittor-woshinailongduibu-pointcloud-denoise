data_name: &data_name models/model_normalized.obj
loader: &loader obj

train_dataset:
  shuffle: True
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: ./dataset_train
    use_prob: False
    num_files: 2
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist_quick/train.txt, 1.0],
      ]

validate_dataset:
  shuffle: False
  batch_size: 1
  num_workers: 0
  datapath:
    input_dataset_dir: ./dataset_train
    use_prob: False
    num_files: 1
    loader: *loader
    data_name: *data_name
    ignore_check: True
    data_path:
      shapenet: [
        [./datalist_quick/validate.txt, 1.0],
      ]
