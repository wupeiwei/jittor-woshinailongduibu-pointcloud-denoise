# Reproducible baseline config for the formal point-cloud denoising competition.
# Model: residual EdgeConv denoiser, pred_clean = noisy + offset.

experiment:
  name: denoise_baseline
  seed: 123

paths:
  data_root: dataset_train
  test_root: dataset_test_noisy
  train_list: starter_code/datalist/train.txt
  out_dir: results/denoise_baseline
  zip: result_denoise_baseline.zip
  ckpt: experiments/denoise_baseline/baseline.pkl

train:
  steps: 5000
  limit: 2000
  num_points: 2048
  batch_size: 2
  lr: 0.0001
  noise_min: 0.005
  noise_max: 0.02
  # Real training baseline: combine point-wise MSE with Chamfer loss.
  # Smoke tests should use configs/denoise_smoke.yaml instead.
  cd_weight: 0.1
  log_every: 20
  save_every: 500

model:
  k: 16
  feat_dim: 256
  hidden: 256
  pwsenel: false
  staas: false
  staas_strength: 1.0
  staas_tau0: 0.02
  staas_tau_min: 0.005
  staas_tau_max: 0.08

predict:
  limit: 0
  patch_size: 1000
